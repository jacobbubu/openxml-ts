<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>create — openxml-ts 浏览器示例</title>
<style>
  body { font-family: system-ui; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 6rem; padding: .4rem; box-sizing: border-box; font-family: monospace; }
  button { margin-top: 1rem; padding: .5rem 1.5rem; cursor: pointer; }
  .note { color: #666; font-size: .85rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>从零创建 Word 文档</h1>
<p>输入文本，每行一个段落，自动下载 docx。</p>

<textarea id="textInput">你好
从浏览器创建的文档
openxml-ts</textarea>

<button id="createBtn">创建并下载</button>
<div class="note" id="status"></div>

<script type="module">
  import {
    WordprocessingDocument, Paragraph, Run, Text
  } from "../../dist/word/index.js";

  const textInput = document.getElementById("textInput");
  const createBtn = document.getElementById("createBtn");
  const status = document.getElementById("status");

  createBtn.addEventListener("click", async () => {
    status.textContent = "创建中...";

    const doc = WordprocessingDocument.create();
    const body = doc.mainDocumentPart.document.firstChild;

    for (const line of textInput.value.split("\n")) {
      const p = new Paragraph();
      const r = new Run();
      r.appendChild(new Text(line || " "));
      p.appendChild(r);
      body.appendChild(p);
    }

    const blob = await doc.toBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "created.docx";
    a.click();
    URL.revokeObjectURL(url);

    status.textContent = "已下载 created.docx！";
  });
</script>
</body>
</html>
