<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>openxml-ts · 浏览器 playground</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
      h1 { margin-top: 0; }
      .drop { border: 2px dashed currentColor; border-radius: 8px; padding: 2rem; text-align: center; opacity: 0.7; }
      .drop.hover { opacity: 1; border-color: dodgerblue; }
      .status { white-space: pre-wrap; background: rgba(127, 127, 127, 0.08); border-radius: 4px; padding: 0.75rem 1rem; margin-top: 1rem; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.85rem; }
      button { font: inherit; padding: 0.4rem 1rem; border-radius: 4px; cursor: pointer; }
      .actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
      a.download { padding: 0.4rem 1rem; border: 1px solid currentColor; border-radius: 4px; text-decoration: none; }
      footer { margin-top: 3rem; font-size: 0.85rem; opacity: 0.7; }
      code { font-family: ui-monospace, SFMono-Regular, monospace; }
    </style>
  </head>
  <body>
    <h1>openxml-ts · 浏览器 playground</h1>
    <p>
      在浏览器里直接读 docx / xlsx / pptx：拖入或选文件 → openxml-ts 解出 element 树 → 统计 + 可选写回下载。
      验证「同一 SDK 在 Node / Bun / 浏览器三端行为一致」（ADR-006）。
    </p>

    <label class="drop" id="drop">
      <strong>拖入 .docx / .xlsx / .pptx</strong>
      <p>或<input type="file" id="file" accept=".docx,.xlsx,.pptx" /></p>
    </label>

    <div class="status" id="status">等待文件…</div>

    <div class="actions" id="actions" hidden>
      <button id="mutate">在 element 树上做最小修改</button>
      <a class="download" id="download" hidden>下载修改后的字节流</a>
    </div>

    <footer>
      <p>
        源码：<a href="https://github.com/jacobbubu/openxml-ts" target="_blank">openxml-ts</a> ·
        Vite playground 在 <code>playground/</code>。Story-6.2 落地。
      </p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
