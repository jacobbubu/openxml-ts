name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Build 必须在 Test 之前——test/cli/cli.test.ts 需要 dist/bin/openxml-ts.js
      # 这个已构建出来的产物（Epic-9 CLI）。
      - name: Build
        run: pnpm build

      # Build 之后才能跑——api-extractor 读 dist/ 下的 .d.ts。drift 时报错。
      - name: API report drift check
        run: pnpm api:check

      - name: Test
        run: pnpm test

  verify-bun:
    name: Verify (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 同 verify job：Build → Test 顺序，CLI 套件依赖 dist/bin。
      - name: Build
        run: pnpm build

      - name: Test (Bun runtime)
        run: bun run vitest run

  verify-size:
    name: Verify (Bundle Size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Size limit (openxml-ts root + openxml-ts/word minimum + full)
        run: pnpm size

  verify-browser:
    name: Verify (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm playwright install --with-deps chromium

      - name: Test (browser / Chromium)
        run: pnpm test:browser
