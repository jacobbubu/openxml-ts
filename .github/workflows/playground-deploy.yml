name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - playground/**
      - src/**
      - package.json
      - tsconfig.json
      - .github/workflows/playground-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      # 1. 把根工程的 dist/ 先编出来——playground 通过 `file:..` 解到 dist/
      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Build root (dist/ ready for playground)
        run: pnpm build

      # 2. playground 自身的依赖（vite / typescript）
      - name: Install playground deps
        working-directory: playground
        run: pnpm install --no-frozen-lockfile

      # 3. 用 GitHub Pages 子路径 base 打包
      - name: Build playground
        working-directory: playground
        env:
          PLAYGROUND_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
