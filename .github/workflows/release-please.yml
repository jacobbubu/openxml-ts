name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 发布到 npm 的自动 job 已被显式移除——release-please 仍会自动开 release
  # PR + 在合并后自动建 GitHub Release/tag，但**不再自动发 npm**。
  # 发 npm 必须由人手动触发 .github/workflows/npm-publish.yml（workflow_dispatch）。
  #
  # 决策原因：避免一发不可撤回（npm 24h 后 unpublish 受限）；要求显式人工确认。
