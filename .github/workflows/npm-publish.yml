name: npm publish (manual)

# 唯一发 npm 的入口——手动 workflow_dispatch，需勾选 confirm=true。
# release-please.yml 只负责开 release PR + 建 GitHub Release/tag，不再自动发 npm。
# 默认 dry-run，避免误发；勾选 confirm 才真的 pnpm publish。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "勾选才真发 npm。不勾选则跑 dry-run 给一个发版预览。"
        type: boolean
        default: false
      tag:
        description: "npm dist-tag（默认 latest）。预发版可填 next/beta。"
        type: string
        default: "latest"

permissions:
  contents: read
  id-token: write # npm provenance 需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: API report drift check
        run: pnpm api:check

      - name: Show what would be published
        run: |
          echo "=== package.json version ==="
          node -p "require('./package.json').version"
          echo "=== pnpm pack --dry-run ==="
          pnpm pack --dry-run

      - name: Publish to npm (dry-run)
        if: ${{ inputs.confirm != true }}
        run: |
          echo "DRY RUN — set confirm=true to actually publish"
          pnpm publish --provenance --access public --no-git-checks --tag ${{ inputs.tag }} --dry-run

      - name: Publish to npm (real)
        if: ${{ inputs.confirm == true }}
        run: pnpm publish --provenance --access public --no-git-checks --tag ${{ inputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
