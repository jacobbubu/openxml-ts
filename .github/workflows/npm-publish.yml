name: npm publish (manual)

# 手动补发入口——用于补发已有 tag（如某次自动发布失败后重试）。
# 常规自动发布由 release-please.yml 的 publish job 完成（release-please
# 用 GITHUB_TOKEN 创建 Release，`release: published` 事件不会触发独立
# workflow，故发布必须在 release-please 同一个 workflow run 内进行）。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance 需要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: API report drift check
        run: pnpm api:check

      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
